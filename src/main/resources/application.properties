spring.application.name=adp
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adp_db?createDatabaseIfNotExist=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:adp}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.member-password=${MEMBER_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@adoptipattes.local}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:adoptipattes@example.com}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
